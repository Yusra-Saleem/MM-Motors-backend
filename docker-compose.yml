version: "3.9"

services:
  backend:
    build: .
    container_name: fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/home/user/app
      - /home/user/app/.venv
    env_file:
      - .env
    environment:
      - PORT=8000
    # Run alembic migrations and start uvicorn with hot-reload enabled
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt # SSL certs ke liye (agar Certbot use kar rahe ho)
    depends_on:
      - backend
